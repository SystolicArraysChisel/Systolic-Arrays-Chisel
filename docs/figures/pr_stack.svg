<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 250" width="980" height="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Stacked pull requests: host-posix-serial on main; bias, leaky-relu, digits-demo and readme stacked on it in a chain; perf-report and board-chain-test also on host-posix-serial; pe-heatmap directly on main.</title>
  <defs>
    <style>
      .br   { fill: #e0ecff; stroke: #3b6fd8; stroke-width: 1.4; }
      .main { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.4; }
      .ln   { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .t    { fill: #0f172a; }
      .n    { fill: #475569; font-size: 11.5px; }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="250" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- lines -->
  <path class="ln" d="M90,60 H130"/>
  <path class="ln" d="M290,60 H330"/>
  <path class="ln" d="M310,60 V120 H330"/>
  <path class="ln" d="M310,120 V180 H330"/>
  <path class="ln" d="M450,60 H490"/>
  <path class="ln" d="M630,60 H670"/>
  <path class="ln" d="M810,60 H840"/>
  <path class="ln" d="M90,215 H130"/>

  <!-- nodes -->
  <rect class="main" x="20" y="44" width="70" height="32" rx="16"/><text class="t" x="55" y="65" text-anchor="middle">main</text>
  <rect class="br" x="130" y="40" width="160" height="40" rx="8"/><text class="t" x="210" y="58" text-anchor="middle">host-posix-serial</text><text class="n" x="210" y="73" text-anchor="middle">#46</text>
  <rect class="br" x="330" y="40" width="120" height="40" rx="8"/><text class="t" x="390" y="58" text-anchor="middle">bias</text><text class="n" x="390" y="73" text-anchor="middle">#47</text>
  <rect class="br" x="490" y="40" width="140" height="40" rx="8"/><text class="t" x="560" y="58" text-anchor="middle">leaky-relu</text><text class="n" x="560" y="73" text-anchor="middle">#48</text>
  <rect class="br" x="670" y="40" width="140" height="40" rx="8"/><text class="t" x="740" y="58" text-anchor="middle">digits-demo</text><text class="n" x="740" y="73" text-anchor="middle">#49</text>
  <rect class="br" x="840" y="40" width="120" height="40" rx="8"/><text class="t" x="900" y="58" text-anchor="middle">readme</text><text class="n" x="900" y="73" text-anchor="middle">#53</text>
  <rect class="br" x="330" y="100" width="140" height="40" rx="8"/><text class="t" x="400" y="118" text-anchor="middle">perf-report</text><text class="n" x="400" y="133" text-anchor="middle">#50</text>
  <rect class="br" x="330" y="160" width="170" height="40" rx="8"/><text class="t" x="415" y="178" text-anchor="middle">board-chain-test</text><text class="n" x="415" y="193" text-anchor="middle">#51</text>
  <rect class="main" x="20" y="199" width="70" height="32" rx="16"/><text class="t" x="55" y="220" text-anchor="middle">main</text>
  <rect class="br" x="130" y="195" width="140" height="40" rx="8"/><text class="t" x="200" y="213" text-anchor="middle">pe-heatmap</text><text class="n" x="200" y="228" text-anchor="middle">#52</text>

  <text class="n" x="960" y="236" text-anchor="end">each PR is based on its parent branch and merged bottom-up</text>
</svg>
