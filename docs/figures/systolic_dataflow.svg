<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Weight-stationary dataflow: each PE keeps one weight; activations enter from the left, skewed by one cycle per row, and move right; partial sums move down into the accumulators.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f9d55"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/>
    </marker>
    <style>
      .pe   { fill: #dcf5e7; stroke: #1f9d55; stroke-width: 1.4; }
      .w    { fill: #0f172a; font-size: 12px; }
      .act  { fill: #e0ecff; stroke: #3b6fd8; stroke-width: 1.2; }
      .atx  { fill: #1e3a8a; font-size: 10px; }
      .flowA { stroke: #3b6fd8; stroke-width: 1.6; marker-end: url(#ab); }
      .flowP { stroke: #1f9d55; stroke-width: 1.6; marker-end: url(#ag); }
      .lbl  { fill: #334155; font-size: 12px; }
      .name { font-weight: 600; fill: #0f172a; }
      .mem  { fill: #fff4d6; stroke: #c99a06; stroke-width: 1.4; }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="470" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- weights from the top -->
  <text class="lbl" x="416" y="28" text-anchor="middle">weights B: loaded once per tile and kept (the next tile's load overlaps)</text>
  <g stroke="#475569" stroke-width="1.4" marker-end="url(#a)">
    <line x1="290" y1="38" x2="290" y2="74"/><line x1="374" y1="38" x2="374" y2="74"/>
    <line x1="458" y1="38" x2="458" y2="74"/><line x1="542" y1="38" x2="542" y2="74"/>
  </g>

  <!-- PE grid: PE(r,c) at x = 260 + 84c, y = 80 + 66r -->
  <g>
    <rect class="pe" x="260" y="80" width="60" height="44" rx="6"/><rect class="pe" x="344" y="80" width="60" height="44" rx="6"/><rect class="pe" x="428" y="80" width="60" height="44" rx="6"/><rect class="pe" x="512" y="80" width="60" height="44" rx="6"/>
    <rect class="pe" x="260" y="146" width="60" height="44" rx="6"/><rect class="pe" x="344" y="146" width="60" height="44" rx="6"/><rect class="pe" x="428" y="146" width="60" height="44" rx="6"/><rect class="pe" x="512" y="146" width="60" height="44" rx="6"/>
    <rect class="pe" x="260" y="212" width="60" height="44" rx="6"/><rect class="pe" x="344" y="212" width="60" height="44" rx="6"/><rect class="pe" x="428" y="212" width="60" height="44" rx="6"/><rect class="pe" x="512" y="212" width="60" height="44" rx="6"/>
    <rect class="pe" x="260" y="278" width="60" height="44" rx="6"/><rect class="pe" x="344" y="278" width="60" height="44" rx="6"/><rect class="pe" x="428" y="278" width="60" height="44" rx="6"/><rect class="pe" x="512" y="278" width="60" height="44" rx="6"/>
  </g>
  <g class="w" text-anchor="middle">
    <text x="290" y="107">w00</text><text x="374" y="107">w01</text><text x="458" y="107">w02</text><text x="542" y="107">w03</text>
    <text x="290" y="173">w10</text><text x="374" y="173">w11</text><text x="458" y="173">w12</text><text x="542" y="173">w13</text>
    <text x="290" y="239">w20</text><text x="374" y="239">w21</text><text x="458" y="239">w22</text><text x="542" y="239">w23</text>
    <text x="290" y="305">w30</text><text x="374" y="305">w31</text><text x="458" y="305">w32</text><text x="542" y="305">w33</text>
  </g>

  <!-- activations move right -->
  <g class="flowA">
    <line x1="320" y1="102" x2="342" y2="102"/><line x1="404" y1="102" x2="426" y2="102"/><line x1="488" y1="102" x2="510" y2="102"/>
    <line x1="320" y1="168" x2="342" y2="168"/><line x1="404" y1="168" x2="426" y2="168"/><line x1="488" y1="168" x2="510" y2="168"/>
    <line x1="320" y1="234" x2="342" y2="234"/><line x1="404" y1="234" x2="426" y2="234"/><line x1="488" y1="234" x2="510" y2="234"/>
    <line x1="320" y1="300" x2="342" y2="300"/><line x1="404" y1="300" x2="426" y2="300"/><line x1="488" y1="300" x2="510" y2="300"/>
  </g>
  <!-- partial sums move down -->
  <g class="flowP">
    <line x1="290" y1="124" x2="290" y2="144"/><line x1="374" y1="124" x2="374" y2="144"/><line x1="458" y1="124" x2="458" y2="144"/><line x1="542" y1="124" x2="542" y2="144"/>
    <line x1="290" y1="190" x2="290" y2="210"/><line x1="374" y1="190" x2="374" y2="210"/><line x1="458" y1="190" x2="458" y2="210"/><line x1="542" y1="190" x2="542" y2="210"/>
    <line x1="290" y1="256" x2="290" y2="276"/><line x1="374" y1="256" x2="374" y2="276"/><line x1="458" y1="256" x2="458" y2="276"/><line x1="542" y1="256" x2="542" y2="276"/>
    <line x1="290" y1="322" x2="290" y2="356"/><line x1="374" y1="322" x2="374" y2="356"/><line x1="458" y1="322" x2="458" y2="356"/><line x1="542" y1="322" x2="542" y2="356"/>
  </g>

  <!-- skewed activation stream: row r starts r cycles later -->
  <text class="lbl" x="128" y="62" text-anchor="middle">activations A, one row</text>
  <text class="lbl" x="128" y="77" text-anchor="middle">of the array per column of A</text>
  <g>
    <circle class="act" cx="236" cy="102" r="11"/><circle class="act" cx="208" cy="102" r="11"/><circle class="act" cx="180" cy="102" r="11"/>
    <circle class="act" cx="208" cy="168" r="11"/><circle class="act" cx="180" cy="168" r="11"/><circle class="act" cx="152" cy="168" r="11"/>
    <circle class="act" cx="180" cy="234" r="11"/><circle class="act" cx="152" cy="234" r="11"/><circle class="act" cx="124" cy="234" r="11"/>
    <circle class="act" cx="152" cy="300" r="11"/><circle class="act" cx="124" cy="300" r="11"/><circle class="act" cx="96" cy="300" r="11"/>
  </g>
  <g class="atx" text-anchor="middle">
    <text x="236" y="106">a00</text><text x="208" y="106">a10</text><text x="180" y="106">a20</text>
    <text x="208" y="172">a01</text><text x="180" y="172">a11</text><text x="152" y="172">a21</text>
    <text x="180" y="238">a02</text><text x="152" y="238">a12</text><text x="124" y="238">a22</text>
    <text x="152" y="304">a03</text><text x="124" y="304">a13</text><text x="96" y="304">a23</text>
  </g>
  <g class="flowA"><line x1="248" y1="102" x2="258" y2="102"/><line x1="220" y1="168" x2="258" y2="168"/><line x1="192" y1="234" x2="258" y2="234"/><line x1="164" y1="300" x2="258" y2="300"/></g>
  <text class="lbl" x="128" y="345" text-anchor="middle">skew: row r of the array</text>
  <text class="lbl" x="128" y="360" text-anchor="middle">receives A[m][r] at cycle m + r</text>

  <!-- accumulators -->
  <rect class="mem" x="260" y="358" width="312" height="44" rx="7"/>
  <text class="name" x="416" y="378" text-anchor="middle">Accumulators</text>
  <text class="lbl" x="416" y="394" text-anchor="middle">de-skew, add across K-tiles, bias, requant, ReLU</text>
  <text class="lbl" x="416" y="430" text-anchor="middle">row m of C leaves the array at cycle m + rows + cols − 1</text>
  <text class="lbl" x="416" y="448" text-anchor="middle">only the edges of the grid touch memory: each weight is reused for every row of A</text>

  <!-- one PE, enlarged -->
  <line x1="620" y1="40" x2="620" y2="440" stroke="#e2e8f0" stroke-width="1.4"/>
  <text class="name" x="800" y="40" text-anchor="middle">One PE, every cycle</text>
  <rect class="pe" x="706" y="110" width="190" height="210" rx="10"/>
  <rect x="726" y="128" width="62" height="34" rx="5" fill="#ffffff" stroke="#1f9d55"/>
  <text class="w" x="757" y="150" text-anchor="middle">weight</text>
  <circle cx="757" cy="215" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="757" y="221" text-anchor="middle" font-size="17">×</text>
  <circle cx="830" cy="215" r="17" fill="#ffffff" stroke="#0f172a" stroke-width="1.3"/>
  <text x="830" y="221" text-anchor="middle" font-size="17">+</text>
  <line x1="757" y1="162" x2="757" y2="196" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="774" y1="215" x2="811" y2="215" stroke="#475569" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- a in / out -->
  <line class="flowA" x1="650" y1="270" x2="704" y2="270"/>
  <path d="M706,270 H757 V234" fill="none" stroke="#3b6fd8" stroke-width="1.6" marker-end="url(#ab)"/>
  <line class="flowA" x1="757" y1="270" x2="944" y2="270"/>
  <text class="lbl" x="664" y="262" text-anchor="middle">a in</text>
  <text class="lbl" x="926" y="262" text-anchor="middle">a out</text>
  <!-- psum in / out -->
  <line class="flowP" x1="830" y1="72" x2="830" y2="196"/>
  <line class="flowP" x1="830" y1="232" x2="830" y2="356"/>
  <text class="lbl" x="838" y="86">sum in</text>
  <text class="lbl" x="838" y="352">sum out</text>
  <text class="lbl" x="800" y="392" text-anchor="middle">sum out = sum in + weight × a in</text>
  <text class="lbl" x="800" y="410" text-anchor="middle">int8 × int8, int32 sum, one DSP slice</text>
</svg>
